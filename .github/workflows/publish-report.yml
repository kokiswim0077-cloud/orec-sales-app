name: OREC日次営業レポート

on:
  schedule:
    - cron: "5 18 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      mode:
        description: 実行内容
        required: true
        default: publish-and-notify
        type: choice
        options:
          - publish-and-notify
          - publish-only
          - notify-only

permissions:
  contents: write

concurrency:
  group: orec-sales-reports
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
      ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
      ONESIGNAL_SUBSCRIPTION_IDS: ${{ secrets.ONESIGNAL_SUBSCRIPTION_IDS }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://dkl5pcrrq8gba.cloudfront.net/sales/' }}
      RUN_MODE: ${{ github.event_name == 'schedule' && 'publish-and-notify' || inputs.mode }}
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout report store
        uses: actions/checkout@v4
        with:
          ref: reports
          path: report-store
          fetch-depth: 1

      - name: Build daily report
        if: ${{ env.RUN_MODE != 'notify-only' }}
        run: node app/scripts/publish.mjs --data-dir report-store

      - name: Validate report data
        if: ${{ env.RUN_MODE != 'notify-only' }}
        run: node app/scripts/validate.mjs report-store

      - name: Commit report before notification
        if: ${{ env.RUN_MODE != 'notify-only' }}
        working-directory: report-store
        shell: bash
        run: |
          git config user.name "orec-sales-intelligence[bot]"
          git config user.email "orec-sales-intelligence[bot]@users.noreply.github.com"
          git add reports observations index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: publish daily sales brief $(date -u +%Y-%m-%d)"
          git push origin HEAD:reports

      - name: Send personal push notification
        if: ${{ env.RUN_MODE != 'publish-only' }}
        run: node app/scripts/notify.mjs --data-dir report-store

      - name: Save notification state
        if: ${{ env.RUN_MODE != 'publish-only' }}
        working-directory: report-store
        shell: bash
        run: |
          git config user.name "orec-sales-intelligence[bot]"
          git config user.email "orec-sales-intelligence[bot]@users.noreply.github.com"
          git add state/notified.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: record daily notification $(date -u +%Y-%m-%d)"
          git push origin HEAD:reports

      - name: Notify publication failure
        if: ${{ failure() }}
        continue-on-error: true
        run: node app/scripts/notify-failure.mjs
