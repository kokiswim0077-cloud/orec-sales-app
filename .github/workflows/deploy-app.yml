name: OREC営業アプリ配布

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - app-config.js
      - manifest.webmanifest
      - sw.js
      - icons/**
      - push/onesignal/**
      - scripts/build-app-config.mjs

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Build public runtime configuration
        env:
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://dkl5pcrrq8gba.cloudfront.net/sales/' }}
        run: node scripts/build-app-config.mjs dist/app-config.js

      - name: Upload application shell
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET || 'orec-parts-chatbot' }}
        shell: bash
        run: |
          aws s3 cp index.html "s3://$S3_BUCKET/sales/index.html" --content-type "text/html; charset=utf-8" --cache-control "no-cache"
          aws s3 cp dist/app-config.js "s3://$S3_BUCKET/sales/app-config.js" --content-type "application/javascript; charset=utf-8" --cache-control "no-cache"
          aws s3 cp manifest.webmanifest "s3://$S3_BUCKET/sales/manifest.webmanifest" --content-type "application/manifest+json" --cache-control "no-cache"
          aws s3 cp sw.js "s3://$S3_BUCKET/sales/sw.js" --content-type "application/javascript; charset=utf-8" --cache-control "no-cache"
          aws s3 cp push/onesignal/OneSignalSDKWorker.js "s3://$S3_BUCKET/sales/push/onesignal/OneSignalSDKWorker.js" --content-type "application/javascript; charset=utf-8" --cache-control "no-cache"
          aws s3 cp icons "s3://$S3_BUCKET/sales/icons" --recursive --cache-control "public,max-age=31536000,immutable"

      - name: Invalidate CloudFront application shell
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/sales/index.html" "/sales/app-config.js" "/sales/manifest.webmanifest" "/sales/sw.js" "/sales/push/onesignal/OneSignalSDKWorker.js"
