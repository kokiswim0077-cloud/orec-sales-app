name: OREC営業情報収集

on:
  schedule:
    - cron: "47 23,5,11,17 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orec-sales-reports
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
      ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
      ONESIGNAL_SUBSCRIPTION_IDS: ${{ secrets.ONESIGNAL_SUBSCRIPTION_IDS }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://dkl5pcrrq8gba.cloudfront.net/sales/' }}
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout report store
        uses: actions/checkout@v4
        with:
          ref: reports
          path: report-store
          fetch-depth: 1

      - name: Collect grounded public information
        run: node app/scripts/collect.mjs --data-dir report-store

      - name: Validate report data
        run: node app/scripts/validate.mjs report-store

      - name: Commit observation
        working-directory: report-store
        shell: bash
        run: |
          git config user.name "orec-sales-intelligence[bot]"
          git config user.email "orec-sales-intelligence[bot]@users.noreply.github.com"
          git add observations state/source-hashes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: collect sales intelligence $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:reports

      - name: Notify collection failure
        if: ${{ failure() }}
        continue-on-error: true
        run: node app/scripts/notify-failure.mjs
